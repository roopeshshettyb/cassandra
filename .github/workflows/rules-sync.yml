name: Rules Sync

# PR check: every rule lives twice, as `.cursor/rules/<name>.mdc` for Cursor and
# `.claude/rules/<name>.md` for Claude Code. This fails when the two copies drift, when one
# side is missing or orphaned, or when a rule is not listed in its folder's AGENTS.md — so a
# rule changed for one tool only cannot merge. Run `scripts/sync-rules.sh` to fix it.
on:
  pull_request:
    branches:
      - main
      - stage
    paths:
      - '**/.cursor/rules/**'
      - '**/.claude/rules/**'
      - '**/AGENTS.md'
      - 'scripts/sync-rules.sh'
      - '.github/workflows/rules-sync.yml'
  workflow_dispatch: {}

jobs:
  check:
    name: Rules in sync
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/sync-rules.sh --check
