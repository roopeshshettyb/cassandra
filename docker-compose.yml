services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: cassandra-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cassandra_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cassandra-net

  # Backend (NestJS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cassandra-backend
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      PORT: 7676
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: cassandra_dev
      DB_SSL: "false"
      DB_POOL_SIZE: 5
      JWT_SECRET: your-secret-key
      FRONTEND_URL: http://localhost:7678
      BACKEND_URL: http://localhost:7676
      # All API keys / SMTP credentials come from .env.docker (see env_file above)
    ports:
      - "7676:7676"
      - "9229:9229"  # Debug port
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cassandra-net
    restart: unless-stopped

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: http://localhost:7676
        REACT_APP_FRONTEND_URL: http://localhost:7678
        REACT_APP_GOOGLE_CLIENT_ID: 587511853834-vhp4a26onvupol0163kos4b51663m04t.apps.googleusercontent.com
    container_name: cassandra-frontend
    environment:
      REACT_APP_BACKEND_URL: http://localhost:7676
      PORT: 7678
    ports:
      - "7678:7678"
    depends_on:
      - backend
    networks:
      - cassandra-net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  cassandra-net:
    driver: bridge
