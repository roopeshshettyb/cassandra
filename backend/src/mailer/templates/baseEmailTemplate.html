<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{APP_NAME}}</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">
    <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background-color: #ffffff; padding: 24px 12px">
      <tr>
        <td align="center">
          <table role="presentation" cellpadding="0" cellspacing="0" width="600" style="max-width: 600px; background-color: #ffffff; border-radius: 12px; overflow: hidden; border: 1px solid #e6e6e6">
            <tr>
              <td style="padding: 22px 24px; background-color: #121212">
                <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
                  <tr>
                    <td valign="middle" style="width: 64px">
                      <img src="{{LOGO_URL}}" alt="{{APP_NAME}}" width="48" height="48" style="display: block; border-radius: 10px" />
                    </td>
                    <td valign="middle" style="padding-left: 12px">
                      <div style="color: {{PRIMARY_COLOR}}; font-size: 18px; font-weight: 700; line-height: 1.2">{{APP_NAME}}</div>
                      <div style="color: {{PRIMARY_HOVER_COLOR}}; font-size: 12px; line-height: 1.4">{{TAGLINE}}</div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td style="padding: 24px"> {{CONTENT}} </td>
            </tr>

            <tr>
              <td style="padding: 18px 24px; border-top: 1px solid #eeeeee; background-color: #ffffff">
                <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
                  <tr>
                    <td valign="top" style="padding-right: 12px">
                      <div style="font-size: 14px; font-weight: 700; color: #111111; margin-bottom: 6px">{{APP_NAME}}</div>
                      <div style="font-size: 12px; color: #666666">Your Hotel Companion</div>
                    </td>
                    <td valign="top" style="text-align: right">
                      <div style="font-size: 14px; font-weight: 700; color: #111111; margin-bottom: 6px">Legal</div>
                      <div style="font-size: 12px; line-height: 1.6">
                        <a href="{{FRONTEND_URL}}/privacy-policy" style="color: #666666; text-decoration: none">Privacy Policy</a><br />
                        <a href="{{FRONTEND_URL}}/fees-refund-policy" style="color: #666666; text-decoration: none">Fees and Refund Policy</a><br />
                        <a href="{{FRONTEND_URL}}/terms-conditions" style="color: #666666; text-decoration: none">Terms and Conditions</a><br />
                        <a href="{{FRONTEND_URL}}/contact" style="color: #666666; text-decoration: none">Contact Us</a>
                      </div>
                    </td>
                  </tr>
                </table>
                <div style="margin-top: 14px; padding-top: 12px; border-top: 1px solid #eeeeee; text-align: center; font-size: 12px; color: #888888">
                  © {{YEAR}} {{APP_NAME}}. All rights reserved.
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
