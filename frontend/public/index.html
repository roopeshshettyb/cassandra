<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="https://flashpact-public-bucket.s3.ap-south-1.amazonaws.com/samantha_logo.jpg" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Samantha is your personal concierge and will make your stay a breeze." />
    <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <!-- Open Graph -->
    <meta property="og:title" content="Samantha - With you, always" />
    <meta property="og:description" content="Samantha is your personal concierge and will make your stay a breeze." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://samantha.flashpact.in" />
    <meta property="og:image" content="https://flashpact-public-bucket.s3.ap-south-1.amazonaws.com/samantha_logo.jpg" />
    <meta property="og:image:secure_url" content="https://flashpact-public-bucket.s3.ap-south-1.amazonaws.com/samantha_logo.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Samantha - With you, always" />
    <meta property="og:site_name" content="Samantha" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Samantha - With you, always" />
    <meta name="twitter:description" content="Samantha is your personal concierge and will make your stay a breeze." />
    <meta name="twitter:image" content="https://flashpact-public-bucket.s3.ap-south-1.amazonaws.com/samantha_logo.jpg" />
    <meta name="twitter:image:alt" content="Samantha - With you, always" />
    <title>Samantha - With you, always</title>
  </head>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
